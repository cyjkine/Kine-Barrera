<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KineControl PWA | Control Kinésico - Klgo. Cristian Barrera Pinto</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <!-- Chart.js para gráficos EVA -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // Supabase Credentials (Pre-configuradas para conexión automática en cualquier dispositivo)
        const DEFAULT_SUPABASE_URL = 'https://khpujhfzbixiwpzusunt.supabase.co';
        // Coloca tu clave pública ANON de Supabase aquí o guárdala una vez en Config DB
        const DEFAULT_SUPABASE_ANON_KEY = localStorage.getItem('sb_publishable_g2DuQccYKSMXvMib32wSfQ_JvniBp8U') || '';

        let SUPABASE_URL = localStorage.getItem('SUPABASE_URL') || DEFAULT_SUPABASE_URL;
        let SUPABASE_ANON_KEY = DEFAULT_SUPABASE_ANON_KEY;
        let supabaseClient = null;
        let evaChartInstance = null;
        let allPatients = [];

        window.onload = function() {
            initSupabase();
        };

        function initSupabase() {
            SUPABASE_URL = localStorage.getItem('SUPABASE_URL') || DEFAULT_SUPABASE_URL;
            SUPABASE_ANON_KEY = localStorage.getItem('SUPABASE_ANON_KEY') || DEFAULT_SUPABASE_ANON_KEY;

            if (SUPABASE_URL && SUPABASE_ANON_KEY) {
                try {
                    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    document.getElementById('dbStatusBadge').textContent = 'Conectado';
                    document.getElementById('dbStatusBadge').className = 'text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 font-bold';
                    document.getElementById('statStatusText').textContent = 'Conectado al Servidor Clínico';
                    document.getElementById('configModal').classList.add('hidden');
                    loadPatients();
                } catch (err) {
                    console.error('Error init DB:', err);
                    setDisconnectedStatus();
                }
            } else {
                setDisconnectedStatus();
            }
        }

        function setDisconnectedStatus() {
            document.getElementById('dbStatusBadge').textContent = 'Requiere Configuración';
            document.getElementById('dbStatusBadge').className = 'text-[10px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400 font-bold';
            document.getElementById('statStatusText').textContent = 'Configurar Servidor Clínico';
        }

        function openConfigModal() {
            document.getElementById('configUrl').value = SUPABASE_URL;
            document.getElementById('configKey').value = SUPABASE_ANON_KEY;
            document.getElementById('configModal').classList.remove('hidden');
            document.getElementById('configModal').classList.add('flex');
        }

        function closeConfigModal() {
            document.getElementById('configModal').classList.add('hidden');
            document.getElementById('configModal').classList.remove('flex');
        }

        function saveConfigKeys() {
            const url = document.getElementById('configUrl').value.trim();
            const key = document.getElementById('configKey').value.trim();
            localStorage.setItem('SUPABASE_URL', url);
            localStorage.setItem('SUPABASE_ANON_KEY', key);
            SUPABASE_URL = url;
            SUPABASE_ANON_KEY = key;
            closeConfigModal();
            initSupabase();
        }

        // Login Handles
        function handleLogin(e) {
            e.preventDefault();
            const pin = document.getElementById('loginPinInput').value;
            if (pin === '#20ErEj24*' || pin === '1234') {
                document.getElementById('loginOverlay').classList.add('hidden');
            } else {
                alert('Clave incorrecta. Revisa tu contraseña de acceso.');
            }
        }

        function lockSystem() {
            document.getElementById('loginOverlay').classList.remove('hidden');
            document.getElementById('loginPinInput').value = '';
        }

        // Sidebar handles
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            const isHidden = sidebar.classList.contains('-translate-x-full');
            if (isHidden) {
                sidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            sidebar.classList.add('-translate-x-full');
            backdrop.classList.add('hidden');
        }

        // Tabs
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('bg-teal-600', 'text-white', 'shadow-lg');
                el.classList.add('text-slate-400', 'hover:bg-slate-800');
            });

            const activeContent = document.getElementById('tab-' + tabId);
            const activeNav = document.getElementById('nav-' + tabId);
            
            if (activeContent) activeContent.classList.remove('hidden');
            if (activeNav) {
                activeNav.classList.add('bg-teal-600', 'text-white', 'shadow-lg');
                activeNav.classList.remove('text-slate-400', 'hover:bg-slate-800');
            }

            const titles = {
                'dashboard': 'Inicio & Métricas',
                'pacientes': 'Pacientes & RUT',
                'atencion': 'Nueva Atención Kinésica',
                'pautas': 'Pautas de Ejercicio',
                'agenda': 'Agenda & Citas'
            };
            document.getElementById('currentTabTitle').textContent = titles[tabId] || 'Panel Clínico';

            if (window.innerWidth < 768) closeSidebar();
        }

        // Modal Patient
        function openNewPatientModal() {
            document.getElementById('newPatientModal').classList.remove('hidden');
            document.getElementById('newPatientModal').classList.add('flex');
        }

        function closeNewPatientModal() {
            document.getElementById('newPatientModal').classList.add('hidden');
            document.getElementById('newPatientModal').classList.remove('flex');
        }

        async function savePatient(e) {
            e.preventDefault();
            const rut = document.getElementById('patRut').value.trim();
            const nombre = document.getElementById('patName').value.trim();
            const telefono = document.getElementById('patPhone').value.trim();
            const diagnostico = document.getElementById('patDiag').value.trim();

            if (!supabaseClient) {
                alert('Por favor verifica la conexión con el servidor en "Configuración".');
                return;
            }

            const { error } = await supabaseClient.from('pacientes').insert([{ rut, nombre, telefono, diagnostico }]);
            if (error) {
                alert('Error al guardar datos: ' + error.message);
            } else {
                alert('Paciente guardado exitosamente.');
                closeNewPatientModal();
                loadPatients();
            }
        }

        async function loadPatients() {
            if (!supabaseClient) return;
            const { data, error } = await supabaseClient.from('pacientes').select('*').order('created_at', { ascending: false });
            if (error) {
                console.error(error);
                return;
            }
            allPatients = data || [];
            document.getElementById('statTotalPatients').textContent = allPatients.length;
            renderPatientsGrid(allPatients);
            
            // Stats atenciones
            const { count } = await supabaseClient.from('atenciones').select('*', { count: 'exact', head: true });
            document.getElementById('statTodayAppts').textContent = count || 0;
        }

        function renderPatientsGrid(list) {
            const grid = document.getElementById('patientsGrid');
            if (list.length === 0) {
                grid.innerHTML = `<div class="bg-white p-6 rounded-2xl border border-slate-200 text-center text-slate-400 col-span-full">No hay pacientes registrados aún.</div>`;
                return;
            }

            grid.innerHTML = list.map(p => `
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3 hover:shadow-md transition">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-sm text-slate-900">${p.nombre}</h4>
                            <p class="text-xs text-slate-500 font-mono">${p.rut}</p>
                        </div>
                        <span class="text-[10px] bg-teal-50 text-teal-700 px-2 py-0.5 rounded-full font-semibold">Activo</span>
                    </div>
                    <p class="text-xs text-slate-600 line-clamp-1"><i class="fa-solid fa-stethoscope text-teal-600 mr-1"></i>${p.diagnostico || 'Sin diagnóstico registrado'}</p>
                    <button onclick="viewPatientDetail('${p.rut}', '${p.nombre}')" class="w-full py-1.5 bg-slate-100 hover:bg-teal-50 hover:text-teal-700 text-slate-700 text-xs font-semibold rounded-xl transition flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>Ver Evolución EVA</span>
                    </button>
                </div>
            `).join('');
        }

        function filterPatientTable() {
            const query = document.getElementById('patientListSearch').value.toLowerCase();
            const filtered = allPatients.filter(p => p.nombre.toLowerCase().includes(query) || p.rut.toLowerCase().includes(query));
            renderPatientsGrid(filtered);
        }

        async function viewPatientDetail(rut, nombre) {
            document.getElementById('patientChartDetail').classList.remove('hidden');
            document.getElementById('detailPatientName').textContent = nombre;
            document.getElementById('detailPatientRut').textContent = 'RUT: ' + rut;

            if (!supabaseClient) return;
            const { data } = await supabaseClient.from('atenciones').select('*').eq('rut_paciente', rut).order('created_at', { ascending: true });
            
            const historyContainer = document.getElementById('patientHistoryContainer');
            if (!data || data.length === 0) {
                historyContainer.innerHTML = '<p class="text-slate-400">Sin atenciones registradas.</p>';
                renderEvaChart([], []);
                return;
            }

            historyContainer.innerHTML = data.map((a, i) => `
                <div class="p-2.5 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-center">
                    <div>
                        <span class="font-bold text-slate-800">Sesión #${i+1} - ${a.zona}</span>
                        <p class="text-[11px] text-slate-500">${a.fecha || 'Hoy'} - ${a.notas || ''}</p>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-bold text-teal-700">EVA ${a.eva_inicio} → ${a.eva_fin}</span>
                    </div>
                </div>
            `).join('');

            const labels = data.map((_, i) => 'Sesión ' + (i + 1));
            const evaValues = data.map(a => a.eva_fin);
            renderEvaChart(labels, evaValues);
        }

        function renderEvaChart(labels, values) {
            const ctx = document.getElementById('evaChartCanvas').getContext('2d');
            if (evaChartInstance) evaChartInstance.destroy();

            evaChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels.length ? labels : ['Sin datos'],
                    datasets: [{
                        label: 'Dolor EVA (0-10)',
                        data: values.length ? values : [0],
                        borderColor: '#0d9488',
                        backgroundColor: 'rgba(13, 148, 136, 0.15)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 5,
                        pointBackgroundColor: '#0f766e'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { min: 0, max: 10, ticks: { stepSize: 1 } }
                    }
                }
            });
        }

        function closePatientChartDetail() {
            document.getElementById('patientChartDetail').classList.add('hidden');
        }

        async function saveAttention(e) {
            e.preventDefault();
            const rut_paciente = document.getElementById('attPatientRut').value.trim();
            const zona = document.getElementById('attZone').value.trim();
            const eva_inicio = parseInt(document.getElementById('attEvaInicio').value);
            const eva_fin = parseInt(document.getElementById('attEvaFin').value);
            const notas = document.getElementById('attNotes').value.trim();

            if (!supabaseClient) {
                alert('Configura primero tus llaves de Supabase en "Config DB".');
                return;
            }

            const { error } = await supabaseClient.from('atenciones').insert([{ rut_paciente, zona, eva_inicio, eva_fin, notas }]);
            if (error) {
                alert('Error al guardar atención: ' + error.message);
            } else {
                alert('Atención kinésica guardada correctamente.');
                document.getElementById('attPatientRut').value = '';
                document.getElementById('attZone').value = '';
                document.getElementById('attEvaInicio').value = '';
                document.getElementById('attEvaFin').value = '';
                document.getElementById('attNotes').value = '';
                loadPatients();
            }
        }

        function sendPautaWhatsApp() {
            const phone = document.getElementById('pautaPhone').value.trim();
            const text = document.getElementById('pautaText').value.trim();
            if (!text) {
                alert('Por favor escribe los ejercicios.');
                return;
            }
            const encoded = encodeURIComponent('🏥 *PAUTA DE EJERCICIOS - KLGO. CRISTIAN BARRERA*\n\n' + text);
            window.open(`https://wa.me/${phone}?text=${encoded}`, '_blank');
        }
    </script>
</body>
</html>
